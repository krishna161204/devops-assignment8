apiVersion: apps/v1
kind: Deployment
metadata:
  name: blue-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assignment8
      version: blue
  template:
    metadata:
      labels:
        app: assignment8
        version: blue
    spec:
      containers:
        - name: blue-app
          image: assignment8-app:blue
          imagePullPolicy: Never
          ports:
            - containerPort: 80