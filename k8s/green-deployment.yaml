apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assignment8
      version: green
  template:
    metadata:
      labels:
        app: assignment8
        version: green
    spec:
      containers:
        - name: green-app
          image: assignment8-app:green
          imagePullPolicy: Never
          ports:
            - containerPort: 80